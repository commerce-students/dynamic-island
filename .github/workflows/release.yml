name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: npm ci

      - name: Bundle the Python runtime
        run: node scripts/prepare-runtime.mjs

      - name: Point the build at this repository
        run: node scripts/ci-publish.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build and attach to the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Keep one release per tag
        if: always()
        run: node scripts/dedupe-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Keep the installer as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Setup
          path: release/*.exe
          if-no-files-found: error
